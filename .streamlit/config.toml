# Visual language follows the apple-design skill (.claude/skills/apple-design):
# system font, restrained palette, soft radii, light/dark tuned separately.

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
headingFontSizes = ["2.5rem", "1.45rem", "1.15rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showSidebarBorder = false

[theme.light]
primaryColor = "#c4613f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
borderColor = "#e3e3e8"
linkColor = "#a84f30"

[theme.light.sidebar]
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#d9714c"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1f1f22"
textColor = "#f5f5f7"
borderColor = "#34343a"
linkColor = "#f0a07f"

[theme.dark.sidebar]
backgroundColor = "#1a1a1d"
secondaryBackgroundColor = "#26262a"
